<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf9f8">
  <title>Ingen anslutning | Uppsala Halkbana</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #fbf9f8; color: #111827; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0 auto 24px; max-width: 320px; color: #6b7280; line-height: 1.5; }
    button {
      height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
      background: #111827; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Ingen anslutning</h1>
    <p>Du verkar vara offline. Kontrollera internetanslutningen och försök igen.</p>
    <button onclick="location.reload()">Försök igen</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>

</html>
